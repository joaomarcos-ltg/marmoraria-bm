<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartão Digital | Marmoraria B&M</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top, #18181b 0%, #09090b 100%); }
    .font-brand { font-family: 'Cinzel', serif; }
  </style>
</head>
<body class="min-h-screen text-zinc-100 flex items-center justify-center p-4">

  <main class="w-full max-w-md bg-zinc-900/90 border border-zinc-800 rounded-3xl p-6 shadow-2xl backdrop-blur-md">
    <div class="text-center border-b border-zinc-800 pb-6">
      <div class="w-24 h-24 mx-auto rounded-2xl bg-gradient-to-br from-amber-500 to-red-700 p-[2px] shadow-lg mb-3">
        <div id="avatarBox" class="w-full h-full bg-zinc-950 rounded-2xl flex items-center justify-center overflow-hidden">
          <span class="font-brand text-2xl font-bold text-amber-400 tracking-wider">B&M</span>
        </div>
      </div>
      <h1 class="font-brand text-xl font-bold tracking-wide text-white">MARMORARIA B&M</h1>
      <p id="cargoPessoa" class="text-xs uppercase tracking-widest text-amber-400 font-bold mt-1">Atendimento & Projetos Sob Medida</p>
      <p class="text-xs text-zinc-400 mt-2">Guaiçara, Lins e Região - SP</p>
    </div>

    <div class="mt-6 space-y-3">
      <a id="btnWhats" href="https://wa.me/5514996132244?text=Ol%C3%A1!%20Vim%20pelo%20Cart%C3%A3o%20Digital%20da%20Marmoraria%20B%26M." target="_blank"
         class="flex items-center justify-center gap-3 w-full py-3.5 px-4 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold shadow-lg transition">
        <span>💬</span> Chamar no WhatsApp
      </a>

      <a href="https://www.bmmarmoraria.com.br/#orcamento"
         class="flex items-center justify-center gap-3 w-full py-3.5 px-4 rounded-2xl bg-amber-500 hover:bg-amber-400 text-zinc-950 font-extrabold shadow-lg transition">
        <span>📐</span> Solicitar Orçamento Online
      </a>

      <button onclick="baixarVCard()"
         class="flex items-center justify-center gap-3 w-full py-3.5 px-4 rounded-2xl bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white font-bold transition">
        <span>📇</span> Salvar na Agenda do Celular
      </button>

      <div class="grid grid-cols-2 gap-3 pt-1">
        <a href="https://www.google.com/maps/search/?api=1&query=Av.+Angelin+Frizze,+35+B+-+Vila+da+Saude,+Guaicara+-+SP" target="_blank"
           class="flex items-center justify-center gap-2 py-3 px-3 rounded-2xl bg-zinc-950 hover:bg-zinc-800 border border-zinc-800 text-xs font-bold text-zinc-200 transition">
          <span>📍</span> Como Chegar
        </a>
        <a href="https://www.bmmarmoraria.com.br"
           class="flex items-center justify-center gap-2 py-3 px-3 rounded-2xl bg-zinc-950 hover:bg-zinc-800 border border-zinc-800 text-xs font-bold text-zinc-200 transition">
          <span>🌐</span> Catálogo & Site
        </a>
      </div>
    </div>

    <div class="mt-6 pt-5 border-t border-zinc-800 text-center">
      <p class="text-[11px] text-zinc-400 uppercase tracking-wider font-semibold mb-3">Aponte a câmera para compartilhar</p>
      <div class="bg-white p-2.5 rounded-2xl inline-block shadow-md">
        <img id="qrImg" src="" alt="QR Code Marmoraria B&M" class="w-32 h-32" />
      </div>
      <p class="text-[11px] text-zinc-500 mt-3">Av. Angelin Frizze, 35 B • Vila da Saúde • Guaiçara/SP</p>
    </div>
  </main>

  <script>
    const PERFIS = {
      geral:  { nome: "Marmoraria B&M", cargo: "Atendimento & Projetos Sob Medida", tel: "5514996132244", foto: "" },
      grazy:  { nome: "Grazy - Marmoraria B&M", cargo: "Grazy • Comercial & Orçamentos", tel: "5514998955624", foto: "/fotos/grazy.jpg" },
      bruno:  { nome: "Bruno - Marmoraria B&M", cargo: "Bruno • Direção & Medição Técnica", tel: "5514996132244", foto: "" },
      gisele: { nome: "Gisele - Marmoraria B&M", cargo: "Gisele • Projetos & Atendimento", tel: "5514996132244", foto: "/fotos/gisele.jpg" },
      michel: { nome: "Michel - Marmoraria B&M", cargo: "Michel • Projetos & Atendimento", tel: "5514996132244", foto: "/fotos/michel.jpg" }
    };

    const params = new URLSearchParams(window.location.search);
    const chave = (params.get("p") || "geral").toLowerCase();
    const perfil = PERFIS[chave] || PERFIS.geral;

    document.getElementById("cargoPessoa").textContent = perfil.cargo; if(perfil.foto){ document.getElementById("avatarBox").innerHTML = `<img src="${perfil.foto}" class="w-full h-full object-cover">`; }
    if (perfil.foto) {
      document.getElementById("avatarBox").innerHTML = `<img src="${perfil.foto}" alt="${perfil.nome}" class="w-full h-full object-cover" />`;
    }
    document.getElementById("btnWhats").href = `https://wa.me/${perfil.tel}?text=${encodeURIComponent("Olá! Vim pelo Cartão Digital da Marmoraria B&M.")}`;
    document.getElementById("qrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(window.location.href)}`;

    function baixarVCard() {
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `FN:${perfil.nome}`,
        "ORG:Marmoraria B&M",
        `TEL;TYPE=CELL,VOICE:+${perfil.tel}`,
        "EMAIL:bmmarmoraria157@gmail.com",
        "URL:https://www.bmmarmoraria.com.br",
        "ADR;TYPE=WORK:;;Av. Angelin Frizze, 35 B - Vila da Saúde;Guaiçara;SP;;Brasil",
        "END:VCARD"
      ].join("\n");

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `contato-${chave}-bm-marmoraria.vcf`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
